# ==============================================================================
# Voidframe Foot Wayland Terminal Configuration
# ==============================================================================
# Fullscreen kiosk terminal hosting TUIOS with zero padding, GPU-accelerated
# glyph rendering, JetBrainsMono Nerd Font, and Voidframe Obsidian theme.

[main]
term=xterm-256color
shell=/bin/bash
login-shell=yes
font=JetBrainsMono Nerd Font:size=11:style=Regular, Noto Color Emoji:size=11
font-bold=JetBrainsMono Nerd Font:size=11:style=Bold
font-italic=JetBrainsMono Nerd Font:size=11:style=Italic
font-bold-italic=JetBrainsMono Nerd Font:size=11:style=Bold Italic
dpi-aware=yes
pad=0x0
bold-text-in-bright=no
gamma-correct-blending=yes

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=block
color=0d0f14 00e5ff
blink=no

[mouse]
hide-when-typing=yes

[csd]
preferred=none
size=0
border-width=0

[colors]
alpha=1.0
background=0d0f14
foreground=e6edf3
flash=9d7cd8
flash-alpha=0.35

# Normal ANSI palette (Voidframe Obsidian)
regular0=0d0f14  # black (void background)
regular1=f7768e  # red
regular2=73daca  # green
regular3=e0af68  # yellow / amber
regular4=7aa2f7  # blue
regular5=9d7cd8  # magenta / violet accent
regular6=00e5ff  # cyan primary accent
regular7=c0caf5  # white

# Bright ANSI palette
bright0=414868   # bright black / slate
bright1=ff899d   # bright red
bright2=7dcfff   # bright green/teal
bright3=f0c674   # bright yellow
bright4=89ddff   # bright blue
bright5=bb9af7   # bright violet
bright6=2ac3de   # bright cyan
bright7=ffffff   # pure white

selection-foreground=0d0f14
selection-background=00e5ff
urls=00e5ff

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

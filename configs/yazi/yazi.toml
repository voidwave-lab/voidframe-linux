# ==============================================================================
# Voidframe Yazi File Manager Configuration (~/.config/yazi/yazi.toml)
# ==============================================================================
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1200
max_height      = 1200
cache_dir       = ""
image_delay     = 15
image_filter    = "triangle"
image_quality   = 80
sixel_fraction  = 15

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', desc = "$EDITOR", block = true, for = "unix" },
]
open = [
    { run = 'xdg-open "$1"', desc = "Open", for = "linux" },
]
extract = [
    { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
]
play = [
    { run = 'ffplay -autoexit "$1"', orphan = true, desc = "Play media", for = "unix" },
]

[open]
rules = [
    { name = "*/", use = ["edit", "open"] },
    { mime = "text/*", use = ["edit"] },
    { mime = "image/*", use = ["open"] },
    { mime = "{audio,video}/*", use = ["play"] },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*}", use = ["extract"] },
    { mime = "application/{json,ndjson,toml,yaml,xml}", use = ["edit"] },
    { mime = "*/javascript", use = ["edit"] },
    { name = "*", use = ["edit", "open"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [0, 0]
suppress_preload = false

# ==============================================================================
# Voidframe Debian 13 (Trixie) Automated Minimal Preseed Configuration
# ==============================================================================
# Installs a headless, minimal Debian Trixie base system (no desktop environment)
# and invokes /opt/voidframe/setup/bootstrap.sh via d-i preseed/late_command.

# --- Localization & Keyboard ---
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i keyboard-configuration/xkb-keymap select us

# --- Network Configuration ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string voidframe
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

# --- Robust Network Settings for Reliable Mirror Access ---
# Disable IPv6 to prevent timeout on broken IPv6 networks
d-i netcfg/disable_ipv6 boolean true
# Force reliable DNS servers during installation (Google DNS)
d-i netcfg/disable_dhcp boolean false
d-i netcfg/get_nameservers string 8.8.8.8 8.8.4.4
d-i netcfg/confirm_nameservers boolean true

# --- Mirror Settings ---
# Use HTTPS protocol for reliable mirror access (HTTP redirects may fail in d-i)
# Note: debian-installer automatically detects the suite/codename (stable/testing/trixie)
# matching the booted ISO.
d-i mirror/protocol string https
d-i mirror/country string manual
d-i mirror/http/hostname string ftp.debian.org
# Most reliable Debian mirror - handles HTTPS properly and has global CDN
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- APT Timeout and Retry Settings ---
# Prevent installer from hanging on slow/unresponsive mirrors
d-i apt-setup/timeout string 30
d-i apt-setup/retries string 5

# --- Account Setup ---
# Root login disabled; default operator account 'void' with sudo privileges
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Voidframe Operator
d-i passwd/username string void
# Default password for live/ISO provisioning: "voidframe" (change on first boot with 'passwd')
d-i passwd/user-password password voidframe
d-i passwd/user-password-again password voidframe
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev bluetooth sudo

# --- Clock and Timezone ---
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# --- Partitioning (Automated EFI + Root Ext4 Single Disk) ---
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/no_bootable_gpt_biosgrub boolean false
d-i partman-partitioning/no_bootable_gpt_efi boolean false

# --- Base System & APT Configuration ---
d-i base-installer/install-recommends boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/security_path string /debian-security

# --- Package Selection (Headless Minimal Base Only - NO Desktop Environment) ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates systemd-resolved dbus-user-session
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# --- Boot Loader (GRUB) ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

# --- Voidframe Late Command Hook ---
# Copies the bundled Voidframe payload (/cdrom/voidframe) into /target/opt/voidframe
# and runs the modular provisioning pipeline inside the target system.
d-i preseed/late_command string \
    mkdir -p /target/opt/voidframe && \
    cp -a /cdrom/voidframe/* /target/opt/voidframe/ && \
    chmod +x /target/opt/voidframe/setup/*.sh /target/opt/voidframe/configs/lemurs/wayland/tuios-session && \
    in-target /bin/bash -c "DISTRO_NAME=voidframe TARGET_USER=void /opt/voidframe/setup/bootstrap.sh --offline --debs-dir /opt/voidframe/debs --user void --distro voidframe 2>&1 | tee /var/log/voidframe-install.log"

# --- Finish Installation & Reboot ---
d-i finish-install/reboot_in_progress note

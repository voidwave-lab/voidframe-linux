name: Build Patched Debian Trixie Netinst ISO

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "Distro name override (default from config.mk: voidframe)"
        required: false
        default: "voidframe"
        type: string
      publish_release:
        description: "Publish hybrid ISO images and .deb packages to a GitHub Release"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Release tag name (used when publish_release is true)"
        required: false
        default: "v0.1.0"
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 1. Invoke the multi-arch .deb build pipeline (amd64 & arm64)
  build-packages:
    uses: ./.github/workflows/build-debs.yml
    permissions:
      contents: write

  # 2. Patch the official Debian 13 (Trixie) netinst ISOs (amd64 & arm64)
  patch-iso:
    name: Patch Debian Trixie ISO (${{ matrix.arch }})
    needs: build-packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ISO tooling (xorriso)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso curl ca-certificates jq shellcheck

      - name: Download built .deb artifacts (${{ matrix.arch }})
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist/debs/${{ matrix.arch }}

      - name: Lint setup and ISO scripts
        run: make lint

      - name: Build patched hybrid Debian Trixie ISO (${{ matrix.arch }})
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x iso/patch-netinst.sh setup/*.sh configs/lemurs/wayland/tuios-session
          make patch-iso \
            ARCH="${{ matrix.arch }}" \
            DISTRO_NAME="${{ inputs.distro_name || 'voidframe' }}" \
            GITHUB_REPO="${{ github.repository }}"

      - name: Verify ISO El Torito / Hybrid Boot Structure
        run: |
          for iso in dist/iso/*-"${{ matrix.arch }}"-netinst.iso; do
            echo "=== Inspecting boot catalog of ${iso} ==="
            xorriso -indev "${iso}" -report_el_torito plain -report_system_area plain
          done

      - name: Upload ISO artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: |
            dist/iso/*-${{ matrix.arch }}-netinst.iso
            dist/iso/*-${{ matrix.arch }}-netinst.iso.sha256
          if-no-files-found: error
          retention-days: 30

  # 3. Publish Hybrid ISOs + .deb Packages + GPLv3 Manifests to GitHub Release
  release-iso:
    name: Publish ISOs & .debs to GitHub Release
    needs:
      - build-packages
      - patch-iso
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release != false)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository for LICENSE
        uses: actions/checkout@v4

      - name: Download all ISO artifacts (amd64 & arm64)
        uses: actions/download-artifact@v4
        with:
          path: release-bundle
          pattern: iso-*
          merge-multiple: true

      - name: Download all .deb artifacts (amd64 & arm64)
        uses: actions/download-artifact@v4
        with:
          path: release-bundle
          pattern: debs-*
          merge-multiple: true

      - name: Prepare Release Checksums & License Bundle
        run: |
          cp LICENSE release-bundle/LICENSE
          cd release-bundle
          sha256sum ./*.iso ./*.deb SOURCE_MANIFEST.txt LICENSE > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publish ISOs and .deb Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v0.1.0' }}
          name: "${{ inputs.distro_name || 'voidframe' }} ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v0.1.0' }}"
          generate_release_notes: true
          files: |
            release-bundle/*.iso
            release-bundle/*.iso.sha256
            release-bundle/*.deb
            release-bundle/SOURCE_MANIFEST.txt
            release-bundle/LICENSE
            release-bundle/SHA256SUMS.txt

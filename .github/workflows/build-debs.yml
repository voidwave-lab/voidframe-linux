name: Build Debian Trixie TUI Packages (.deb)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish built .deb packages to a GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag name (used when publish_release is true)"
        required: false
        default: "v0.1.0"
        type: string
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "config.mk"
      - "Makefile"
      - "docker/**"
      - ".github/workflows/build-debs.yml"
  pull_request:
    paths:
      - "config.mk"
      - "Makefile"
      - "docker/**"
      - ".github/workflows/build-debs.yml"

permissions:
  contents: write

jobs:
  build-debs:
    name: Build .debs (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch fallback support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build .deb packages in Debian Trixie container (${{ matrix.arch }})
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          make build-debs-docker \
            ARCH="${{ matrix.arch }}" \
            GITHUB_REPO="${{ github.repository }}" \
            DOCKER_BUILD_ARGS="--cache-from type=gha,scope=deb-builder-${{ matrix.arch }} --cache-to type=gha,mode=max,scope=deb-builder-${{ matrix.arch }}"

      - name: Verify built .deb packages (${{ matrix.arch }})
        run: |
          ls -lh "dist/debs/${{ matrix.arch }}/"
          count=0
          for deb in "dist/debs/${{ matrix.arch }}"/*.deb; do
            echo "=== Inspecting ${deb} ==="
            dpkg-deb --info "${deb}"
            dpkg-deb --contents "${deb}"
            count=$((count + 1))
          done
          if [ "${count}" -lt 10 ]; then
            echo "Expected 10 .deb packages, found ${count}" >&2
            exit 1
          fi

      - name: Upload .deb artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: |
            dist/debs/${{ matrix.arch }}/*.deb
            dist/debs/${{ matrix.arch }}/Packages*
            dist/debs/${{ matrix.arch }}/SHA256SUMS
            dist/debs/${{ matrix.arch }}/SOURCE_MANIFEST.txt
          if-no-files-found: error
          retention-days: 30

  release-debs:
    name: Publish .deb Packages to GitHub Release
    needs: build-debs
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository for LICENSE
        uses: actions/checkout@v4

      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: debs-*
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        run: |
          cp LICENSE release-assets/LICENSE
          cd release-assets
          sha256sum ./*.deb SOURCE_MANIFEST.txt LICENSE > SHA256SUMS.debs.txt
          cat SHA256SUMS.debs.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Voidframe ${{ inputs.release_tag }} (.deb Packages)"
          generate_release_notes: true
          files: |
            release-assets/*.deb
            release-assets/SOURCE_MANIFEST.txt
            release-assets/LICENSE
            release-assets/SHA256SUMS.debs.txt
